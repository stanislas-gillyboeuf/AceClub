name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de la release (ex: 1.2.0)'
        required: true
        type: string
      release_notes:
        description: 'Notes de release (laisser vide pour auto-générer)'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into main
        run: |
          git checkout main
          git pull origin main
          git merge origin/dev -m "chore: merge dev into main for release v${{ inputs.version }}"

      - name: Bump iOS version
        run: |
          PBXPROJ="apps/ios/AceClub.xcodeproj/project.pbxproj"

          # Update MARKETING_VERSION to the release version
          sed -i "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = ${{ inputs.version }}/" "$PBXPROJ"

          # Increment CURRENT_PROJECT_VERSION (build number)
          CURRENT_BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION' "$PBXPROJ" | sed 's/[^0-9]*//g')
          NEW_BUILD=$((CURRENT_BUILD + 1))
          sed -i "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $NEW_BUILD/g" "$PBXPROJ"

          echo "📱 Version: ${{ inputs.version }} (build $NEW_BUILD)"

      - name: Commit version bump
        run: |
          git add apps/ios/AceClub.xcodeproj/project.pbxproj
          git commit -m "chore: bump iOS version to ${{ inputs.version }}"
          git push origin main

      - name: Create and push tag
        run: |
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Generate changelog
        id: changelog
        run: |
          # Récupérer le tag précédent
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "Première release - pas de changelog automatique"
            echo "changelog=Première release 🎉" >> $GITHUB_OUTPUT
          else
            echo "Génération du changelog depuis $PREVIOUS_TAG"
            CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
            # Escape pour GitHub Actions
            CHANGELOG="${CHANGELOG//'%'/'%25'}"
            CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
            CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
            echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          body: |
            ## 🚀 Release v${{ inputs.version }}

            ${{ inputs.release_notes || steps.changelog.outputs.changelog }}

            ---
            *Release créée automatiquement depuis la branche `dev`*
          draft: false
          prerelease: false
          generate_release_notes: ${{ inputs.release_notes == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
