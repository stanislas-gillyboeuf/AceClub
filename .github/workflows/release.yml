name: Release & Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (from tag $TAG)"

      - name: Merge dev into main
        run: |
          git checkout main
          git pull origin main
          git merge origin/dev -m "chore: merge dev into main for release ${{ steps.version.outputs.tag }}"

      - name: Update app.json version
        run: |
          cd apps/mobile
          # Update expo.version in app.json
          jq '.expo.version = "${{ steps.version.outputs.version }}"' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "Updated app.json version to ${{ steps.version.outputs.version }}"
          cat app.json | jq '.expo.version'

      - name: Commit and push
        run: |
          git add apps/mobile/app.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin main

      - name: Move tag to merged commit
        run: |
          git tag -fa "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}" --force

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger EAS deploy workflow
        working-directory: apps/mobile
        run: eas workflow:run ../../.eas/workflows/deploy-production.yml --non-interactive
